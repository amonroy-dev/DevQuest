name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devquest
          POSTGRES_PASSWORD: devquest
          POSTGRES_DB: devquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devquest:devquest@localhost:5432/devquest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm test
      - run: npm run lint
      - run: npm run build
