services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devquest
      POSTGRES_PASSWORD: devquest
      POSTGRES_DB: devquest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://devquest:devquest@db:5432/devquest
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
